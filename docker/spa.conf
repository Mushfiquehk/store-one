server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. It is named explicitly because of the `set` below:
  # nginx only resolves a variable upstream at request time if it has a resolver
  # to do it with.
  resolver 127.0.0.11 valid=10s;

  # The API lives in the core container. Proxying rather than pointing the bundle
  # at an absolute origin keeps the browser on one origin, which is the
  # difference between this working and a CORS preflight on every request.
  #
  # The upstream goes through a variable deliberately. With a literal
  # `proxy_pass http://core:5000`, nginx resolves the name once at startup and
  # refuses to start at all if it does not answer — so every one of these
  # containers would depend on the core being up before it could serve a static
  # file. That is precisely the coupling this feature exists to remove: the till
  # holds its own data and keeps taking money with the core down, and a till
  # that will not boot without it is not an independent deployable.
  #
  # With a variable, resolution happens per request: the page serves, and only
  # the API call fails, which is the honest failure and the one the till is
  # already built to survive.
  set $core_upstream "http://core:5000";

  location /api/ {
    proxy_pass $core_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A single-page app owns its routing: an unknown path is a route, not a
  # missing file, and must come back as index.html rather than a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
